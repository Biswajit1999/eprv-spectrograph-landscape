[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eprv-landscape"
version = "0.2.0"
description = "A source-traceable study of precision radial-velocity spectrographs, measurement contexts, status, and open problems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Biswajit Jana"}]
dependencies = ["pandas>=2.0", "matplotlib>=3.7", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
eprv-landscape = "eprv_landscape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
