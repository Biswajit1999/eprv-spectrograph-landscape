<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">How radial-velocity spectroscopy reveals an unseen exoplanet</title>
  <desc id="desc">A hand-drawn physics-notebook style explanation showing a planet making its star wobble, starlight passing through a fibre-fed echelle spectrograph, Doppler shifts in absorption lines, a periodic radial-velocity curve, and why the measurement matters.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#173d72" stroke-width="1.5"/>
    </marker>
    <style>
      .paper{fill:#fbf8ef}.ink{fill:none;stroke:#173d72;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.6}.dash{stroke-dasharray:8 8}.faint{stroke:#9fb1c6;stroke-width:1;opacity:.35}.txt{fill:#173d72;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:20px}.small{font-size:16px}.tiny{font-size:13px}.head{font-size:25px;font-weight:700}.note{fill:#173d72;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:17px}.box{fill:#fffdf7;stroke:#173d72;stroke-width:1.7}.warm{fill:#f6dfad;stroke:#173d72;stroke-width:1.8}.bluefill{fill:#dce9f2;stroke:#173d72;stroke-width:1.8}
    </style>
  </defs>

  <rect class="paper" width="900" height="1120" rx="18"/>
  <g opacity=".28">
    <path class="faint" d="M32 108H868M32 166H868M32 224H868M32 282H868M32 340H868M32 398H868M32 456H868M32 514H868M32 572H868M32 630H868M32 688H868M32 746H868M32 804H868M32 862H868M32 920H868M32 978H868M32 1036H868"/>
  </g>

  <g filter="url(#wobble)">
    <text x="42" y="52" class="txt head">How an invisible planet becomes a measurable RV signal</text>
    <path class="ink thin" d="M42 63 C280 58 528 67 824 61"/>

    <text x="42" y="102" class="txt head">1. A planet makes its star wobble</text>
    <path class="ink thin" d="M42 111 H410"/>
    <ellipse cx="287" cy="197" rx="175" ry="72" class="ink dash"/>
    <circle cx="287" cy="197" r="61" class="warm"/>
    <path class="ink thin" d="M261 172l13 14 18-27 11 31 25-9-16 23 23 14-31 2 5 29-21-20-18 19 7-28-30-5 27-12z"/>
    <circle cx="456" cy="170" r="15" class="bluefill"/>
    <path class="ink thin" d="M444 168c8-8 19-10 28-4M455 155c-2 10 2 20 11 28"/>
    <path class="ink" marker-end="url(#arrow)" d="M315 132 C357 101 413 108 446 145"/>
    <path class="ink" marker-end="url(#arrow)" d="M234 225 C214 211 209 185 220 166"/>
    <text x="480" y="170" class="txt small">planet</text>
    <text x="201" y="290" class="note">The star and planet orbit their common centre of mass.</text>
    <text x="201" y="315" class="note">That tiny stellar motion is what we can measure.</text>

    <g transform="translate(555 105)">
      <rect width="292" height="220" class="box" transform="rotate(-1 146 110)"/>
      <text x="22" y="36" class="txt small">We usually cannot see the</text>
      <text x="22" y="62" class="txt small">planet directly — it is faint.</text>
      <text x="22" y="101" class="txt small">But its gravity makes the</text>
      <text x="22" y="127" class="txt small">star move toward and away</text>
      <text x="22" y="153" class="txt small">from us.</text>
      <path class="ink" d="M28 179 C81 164 117 201 166 177 S244 177 268 166"/>
      <text x="39" y="207" class="txt tiny">tiny wobble → unseen world</text>
    </g>

    <text x="42" y="365" class="txt head">2. Collect the starlight and spread it into a spectrum</text>
    <path class="ink thin" d="M42 376 H676"/>
    <path class="ink" d="M74 472 C85 421 124 397 166 406 C204 414 226 445 226 483 L226 501 L68 501 Z"/>
    <path class="ink thin" d="M91 498 C104 452 140 431 177 434 C198 436 215 448 225 466"/>
    <path class="ink thin" d="M58 507 H238M76 523 H225"/>
    <text x="82" y="548" class="txt small">telescope</text>
    <path class="ink" marker-end="url(#arrow)" d="M228 470 C294 466 311 481 348 486"/>
    <path class="ink" d="M349 485 C397 490 420 468 455 468"/>
    <text x="270" y="455" class="txt small">fibre</text>
    <rect x="455" y="449" width="32" height="38" class="box"/>
    <path class="ink thin" d="M487 455 L567 431M487 468 L567 460M487 480 L567 490"/>
    <path class="ink" d="M570 412 L607 424 L586 535 L549 523 Z"/>
    <path class="ink thin" d="M564 421l38 13M560 435l38 13M557 449l38 13M554 463l38 13M551 477l38 13M549 491l38 13M546 505l38 13"/>
    <text x="533" y="397" class="txt small">echelle grating</text>
    <path class="ink thin" d="M597 438 L744 419M596 452 L744 442M593 468 L744 466M590 484 L744 489M587 501 L744 515"/>
    <rect x="744" y="397" width="48" height="136" class="box"/>
    <path class="ink thin" d="M753 410v110M765 410v110M777 410v110"/>
    <text x="728" y="557" class="txt small">detector</text>
    <text x="42" y="588" class="note">Stable fibre illumination + a high-resolution spectrograph lets us track very small wavelength shifts.</text>

    <text x="42" y="642" class="txt head">3. Doppler shift: the absorption lines move</text>
    <path class="ink thin" d="M42 652 H506"/>
    <text x="44" y="687" class="txt small">toward us → blue-shift</text>
    <rect x="44" y="700" width="352" height="52" class="box"/>
    <g class="ink thin">
      <path d="M83 704v44M119 704v44M159 704v44M214 704v44M262 704v44M311 704v44M352 704v44"/>
      <path d="M95 704v44M221 704v44M278 704v44" stroke-width="3.3"/>
    </g>
    <text x="44" y="787" class="txt small">away from us → red-shift</text>
    <rect x="44" y="800" width="352" height="52" class="box"/>
    <g class="ink thin">
      <path d="M91 804v44M127 804v44M167 804v44M222 804v44M270 804v44M319 804v44M360 804v44"/>
      <path d="M103 804v44M229 804v44M286 804v44" stroke-width="3.3"/>
    </g>
    <path class="ink" marker-end="url(#arrow)" d="M405 724 H465"/>
    <path class="ink" marker-end="url(#arrow)" d="M405 823 H465"/>
    <text x="478" y="730" class="txt small">Δλ</text>
    <text x="478" y="823" class="txt small">Δλ</text>
    <text x="521" y="765" class="txt">vᵣ / c ≈ Δλ / λ</text>
    <text x="521" y="796" class="txt small">tiny shifts → radial velocity</text>

    <text x="42" y="908" class="txt head">4. Repeat the measurement → a periodic RV curve</text>
    <path class="ink thin" d="M42 918 H627"/>
    <path class="ink" d="M70 1040V948H470M70 995H470"/>
    <path class="ink" d="M78 992 C112 944 151 946 184 992 S253 1039 286 992 S356 946 390 992 S440 1026 466 1000"/>
    <g fill="#173d72">
      <circle cx="93" cy="971" r="4"/><circle cx="132" cy="950" r="4"/><circle cx="166" cy="971" r="4"/><circle cx="205" cy="1018" r="4"/><circle cx="247" cy="1026" r="4"/><circle cx="291" cy="987" r="4"/><circle cx="331" cy="950" r="4"/><circle cx="371" cy="966" r="4"/><circle cx="411" cy="1015" r="4"/><circle cx="452" cy="1010" r="4"/>
    </g>
    <text x="84" y="1064" class="txt tiny">time</text>
    <text x="11" y="984" class="txt tiny" transform="rotate(-90 11 984)">radial velocity</text>
    <path class="ink thin" d="M132 938V925M331 938V925M132 929H331"/>
    <text x="193" y="920" class="txt tiny">one orbit = period P</text>

    <g transform="translate(520 892)">
      <rect width="327" height="167" class="box" transform="rotate(1 164 84)"/>
      <text x="18" y="30" class="txt small">Why this matters</text>
      <text x="22" y="59" class="txt tiny">★ detects planets too faint to image</text>
      <text x="22" y="83" class="txt tiny">★ gives orbital period and minimum mass</text>
      <text x="22" y="107" class="txt tiny">★ tests low-mass / Earth-like candidates</text>
      <text x="22" y="131" class="txt tiny">★ makes instrument stability scientifically critical</text>
      <text x="22" y="156" class="txt small">Small shifts. Big discoveries.</text>
    </g>

    <text x="43" y="1091" class="txt small">“From starlight to new worlds.”</text>
    <text x="650" y="1087" class="txt small">Biswajit Jana</text>
    <path class="ink thin" d="M648 1094 C700 1085 757 1098 842 1091"/>
    <text x="699" y="1111" class="txt tiny">11th August 2025</text>
  </g>
</svg>
